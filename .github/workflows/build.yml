name: Build Workflow
on: [ push, pull_request ]

jobs:
  build:
    name: Build (C++${{ matrix.cpp_standard }}, Header Only ${{ matrix.use_header_only }}, ${{ matrix.config }})
    runs-on: windows-latest

    strategy:
      matrix:
        cpp_standard: [ 20 ]
        use_header_only: [ NO, YES ]
        config: [ Debug, Release, MinSizeRel, RelWithDebInfo ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create build directory
        run: mkdir build

      - name: Configure
        working-directory: build
        run: |
          cmake `
            -DCMAKE_CXX_STANDARD=${{ matrix.cpp_standard }} `
            -DRED4EXT_HEADER_ONLY=${{ matrix.use_header_only }} `
            -DRED4EXT_USE_PCH=ON `
            -DRED4EXT_BUILD_EXAMPLES=ON `
            -DRED4EXT_EXTRA_WARNINGS=ON `
            -DRED4EXT_TREAT_WARNINGS_AS_ERRORS=ON `
            ${{ github.workspace }}

      - name: Build
        working-directory: build
        run: |
          cmake `
            --build . `
            --config ${{ matrix.config }}

  build-macos:
    name: Build macOS (Header Only ${{ matrix.use_header_only }}, ${{ matrix.config }})
    runs-on: macos-14 # Apple Silicon

    strategy:
      fail-fast: false
      matrix:
        use_header_only: [ NO, YES ]
        config: [ Debug, Release ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # RED4EXT_USE_PCH is passed explicitly, matching the Windows job. It defaults to OFF, so
      # leaving it out meant the precompiled header was never built here -- and it did not
      # compile, because it included <intrin.h> and <Windows.h> unconditionally.
      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.config }} \
            -DCMAKE_CXX_STANDARD=20 \
            -DRED4EXT_HEADER_ONLY=${{ matrix.use_header_only }} \
            -DRED4EXT_USE_PCH=ON \
            -DRED4EXT_BUILD_EXAMPLES=ON \
            -DRED4EXT_INSTALL=OFF

      # RED4EXT_EXTRA_WARNINGS / RED4EXT_TREAT_WARNINGS_AS_ERRORS are deliberately left
      # off here, unlike the Windows job. Clang's -Wall -Wextra surfaces ~120 pre-existing
      # diagnostics that MSVC's /W4 does not (-Wignored-qualifiers, -Wreorder-ctor-init,
      # -Wnonportable-include-path, deprecated implicit copy constructors). None are
      # macOS-specific and none are introduced by this port, so failing the build on them
      # would only make the job red for reasons unrelated to what it is meant to guard.
      #
      # RED4EXT_BUILD_GPUAPI defaults to OFF off Windows: those headers wrap Direct3D 12.

      - name: Build
        run: cmake --build build
